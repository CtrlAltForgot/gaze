name: Build and test gaze
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Matching downloader version
        run: |
          python3 -m venv "$RUNNER_TEMP/gaze-tools"
          "$RUNNER_TEMP/gaze-tools/bin/pip" install yt-dlp==2026.8.19
          echo "$RUNNER_TEMP/gaze-tools/bin" >> "$GITHUB_PATH"
      - run: node --test server/test/*.test.js
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev libmpv-dev
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build ${{ matrix.platform }} --release
      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/gaze-linux
          cp -a build/linux/x64/release/bundle dist/gaze-linux/
          cp packaging/linux/install.sh dist/gaze-linux/
          tar -C dist -czf dist/gaze-linux-x64.tar.gz gaze-linux
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # Ship the application-local CRT so fresh Windows installs can run it.
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $crt = Get-ChildItem "$vs/VC/Redist/MSVC/*/x64/Microsoft.VC*.CRT" -Directory | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $crt) { throw 'Visual C++ redistributable directory was not found.' }
          Copy-Item "$($crt.FullName)/*.dll" build/windows/x64/runner/Release/
          foreach ($name in @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (-not (Test-Path "build/windows/x64/runner/Release/$name")) { throw "Missing runtime: $name" }
          }
          Copy-Item packaging/windows/register-invites.ps1 build/windows/x64/runner/Release/
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/gaze-windows-x64.zip
      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/gaze.app dist/gaze-macos.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gaze-${{ matrix.platform }}
          path: dist/*.*
          if-no-files-found: error
